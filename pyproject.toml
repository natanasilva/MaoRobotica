[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mao-robotica"
version = "0.1.0"
description = "Controle de uma mão robótica com MediaPipe, Arduino e PCA9685"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10.32,<0.11", "opencv-contrib-python>=4.11,<5", "numpy>=2,<3"]

[project.scripts]
mao-robotica = "mao_robotica.main:main"

[tool.setuptools.packages.find]
where = ["src"]
